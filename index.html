<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orrery</title>

  html,body{margin:0;height:100%;background:#23272b;overflow:hidden}
  canvas{display:block}

<body>
<canvas id="c"></canvas>
<script>
'use strict';
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const ROMAN=['','i','ii','iii','iv','v'];
// paper = ground, ink = player/text. Flat colors only, no glow.
const PAL={paper:'#23272b',ink:'#e9e6df',faint:'#2d3237',faint2:'#383e44',clearing:'#272b30',muted:'#8a9097',white:'#ffffff',
  card:'rgba(20,23,26,.82)',veil:'35,39,43',boss:'#101214',
  red:'#d0644b',mustard:'#dcae4f',sage:'#86a889',plum:'#9a6a8c',slate:'#7489a3',mote:'#3cc0b0'};
const THEMES={dark:{paper:PAL.paper,ink:PAL.ink,faint:PAL.faint,faint2:PAL.faint2,clearing:PAL.clearing,muted:PAL.muted,card:PAL.card,veil:PAL.veil},
  light:{paper:'#ece8df',ink:'#2a2e33',faint:'#e0dbd0',faint2:'#d0cabd',clearing:'#e5e1d7',muted:'#767c83',card:'rgba(250,248,243,.9)',veil:'236,232,223'}};
// PAL is mutated in place since draw code reads it every frame; accents and boss stay the same in both themes
function setTheme(t){Object.assign(PAL,THEMES[t]);document.documentElement.style.background=document.body.style.background=PAL.paper}
const PCOL=['#f2c14e','#8fb8de'],PNAME=['sun','moon']; // co-op player colours/names
// playable bodies. solo starts as earth; moon and sun awaken by how deep you've gone (best stage). co-op: host is sun, guest is moon.
const CHARS={
  earth:{col:'#4a7fb5',hp:1,spd:1,slots:['pulse','thorn'],need:0,trait:'one extra heart · dashes end in a tremor',desc:'sturdy · one extra heart, and every dash ends in a tremor'},
  moon:{col:PCOL[1],hp:0,spd:1.1,slots:['pulse','crescent'],need:6,trait:'quicker · a longer dash that hides you longer',desc:'quick · a longer dash that hides you longer, and a crescent that comes back'},
  sun:{col:PCOL[0],hp:0,spd:1,slots:['flare','thorn'],need:11,trait:'dashes ignite where you stood',desc:'fierce · dashes ignite where you stood, and you burn whatever comes close'},
};
const pcol=p=>CHARS[p.ch]?.col||PCOL[p.id]||PAL.ink;
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
function segDist(p,a,b){const abx=b.x-a.x,aby=b.y-a.y,t=clamp(((p.x-a.x)*abx+(p.y-a.y)*aby)/(abx*abx+aby*aby||1),0,1);return Math.hypot(a.x+abx*t-p.x,a.y+aby*t-p.y)}
console.assert(Math.abs(angDiff(.1,TAU+.1))<1e-9,'angDiff');
console.assert(segDist({x:5,y:3},{x:0,y:0},{x:10,y:0})===3&&segDist({x:-4,y:3},{x:0,y:0},{x:10,y:0})===5,'segDist');

/* ================= native bridge (bridge.swift): Core Haptics per grip + triggers/lightbar ================= */
const NB={ws:null,ctrl:null,engines:[],key:''};
function nbConnect(){
  const ws=new WebSocket('ws://127.0.0.1:8765');
  ws.onopen=()=>{NB.ws=ws;NB.key='';ws.send('{"hello":1}')};
  ws.onmessage=e=>{try{Object.assign(NB,JSON.parse(e.data))}catch(_){}};
  ws.onclose=()=>{NB.ws=null;NB.ctrl=null;setTimeout(nbConnect,3000)};
}
// only look for the bridge when running locally (or ?bridge): on a hosted page it would make every visitor's browser
// probe their own machine, and newer Chrome asks a "local network access" permission for that.
const BRIDGE=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)||new URLSearchParams(location.search).has('bridge');
if(BRIDGE){nbConnect();setInterval(()=>NB.ws?.send('{"hello":1}'),2000)}
const native=()=>!!(NB.ws&&NB.ctrl);
addEventListener('pagehide',()=>NB.ws?.send('{"r2":["off"],"l2":["off"]}')); // don't leave a trigger buzzing after the tab closes

// Haptic recipes: [time s, duration s (0 = transient), intensity, sharpness, pan -1 left grip .. 1 right grip].
// The same recipe also drives the sound, so what you hear matches what you feel.
const EV={
  step:p=>[[0,0,.14,.35,p]],
  dash:p=>[[0,0,.5,.8,-p],[.035,0,.6,.7,0],[.07,0,.8,.6,p],[.07,.12,.25,.9,p]],
  hurt:p=>[[0,0,1,.9,p],[0,.35,1,.1,p],[.1,0,.7,.5,-p*.5]],
  heal:()=>[[0,.25,.4,.2,-1],[.12,.25,.4,.25,1]],
  mote:(p,n=0)=>[[0,0,.22,clamp(.3+n*.04,.3,1),p]],
  pickup:()=>[[0,0,.7,.6,-1],[.08,0,.8,.7,0],[.16,0,1,.8,1]],
  upgrade:()=>[[0,0,.6,.5,0],[.1,0,.8,.7,0],[.2,0,1,.9,0],[.2,.3,.5,.4,0]],
  clear:()=>[0,1,2,3,4,5].map(i=>[i*.07,0,.45+i*.1,.5,-1+i*.4]).concat([[.42,.5,.5,.3,0]]),
  boss:()=>[[0,1.2,1,0,0],[.4,0,1,.3,-1],[.8,0,1,.3,1]],
  death:()=>[[0,0,1,.6,0],[0,1.4,1,0,0],[.35,0,.6,.2,-1],[.7,0,.5,.2,1]],
  heart:()=>[[0,0,.8,.1,0],[0,.07,.4,0,0],[.18,0,.5,.1,0]],
  select:()=>[[0,0,.25,.8,0]],
  deny:()=>[[0,0,.5,1,0],[.08,0,.5,1,0]],
  // weapons
  pulse:p=>[[0,0,.8,.5,p],[0,.18,.6,.15,0]],
  thorn:p=>[[0,0,.35,1,p]],
  tether:(p,i=.5)=>[[0,.11,.3+i*.5,.75,p]],
  orbitHit:p=>[[0,0,.45,.95,p]],
  fling:p=>[[0,0,.7,.8,-1],[0,0,.7,.8,1],[0,.15,.4,.6,p]],
  regrow:()=>[[0,0,.35,.7,-.6],[.07,0,.35,.7,.6]],
  charge:(p,c=0)=>[[0,.17,.15+c*.6,.2+c*.7,p]],
  launch:p=>[[0,0,.5,.6,p],[0,.08,.3,.4,p]],
  burst:p=>[[0,0,1,.4,p],[0,.4,.9,.05,p],[.06,0,.6,.7,-p]],
  moth:p=>[[0,0,.2,1,p],[.03,0,.15,1,p]],
  rift:p=>[[0,.6,.9,0,p],[0,0,.8,.2,p]],
  riftHum:p=>[[0,.26,.35,0,p]],
  hit:p=>[[0,0,.3,.8,p]],
  // enemies
  kill:p=>[[0,0,.75,.55,p],[0,.1,.4,.25,p]],
  killBig:p=>[[0,0,1,.35,p],[0,.35,.9,.08,p],[.08,0,.7,.5,p]],
  warn:p=>[[0,.25,.35,.95,p]],
  spit:p=>[[0,0,.25,.9,p]],
  volley:p=>[[0,0,.6,.7,p],[0,.25,.3,.5,p]],
  windup:p=>[[0,0,.2,.1,p],[.2,0,.4,.1,p],[.4,0,.6,.1,p],[.6,0,.8,.1,p]],
  stomp:p=>[[0,0,1,.15,p],[0,.5,1,0,p]],
  // co-op
  clink:p=>[[0,0,.35,1,p],[.04,0,.2,1,p]],                       // your hit bounced off the other player's mark
  bond:()=>[[0,0,1,.9,-1],[0,0,1,.9,1],[0,.3,.8,.5,0],[.08,0,.7,.7,0]],
  strain:(p,k=0)=>[[0,0,.3+.5*clamp(k,0,1),1,p],[0,.3,.2+.6*clamp(k,0,1),.6,p]], // a tick + pull toward your partner, faster as the snap nears
  snap:()=>[[0,0,1,1,-1],[0,0,1,1,1],[0,.4,.9,.1,0]],
  down:()=>[[0,.6,.9,.05,0],[.2,0,.6,.3,-1],[.4,0,.5,.3,1]],
  revive:()=>[[0,0,.5,.5,-1],[.08,0,.6,.6,1],[.16,.4,.6,.4,0]],
  call:p=>[[0,0,.45,.3,p],[.15,0,.3,.3,p]],                       // downed partner calling, from their direction
  echo:p=>[[0,0,.4,.5,p]],                                        // your partner got hit
  farHeart:p=>[[0,0,.35,.1,p],[.18,0,.25,.1,p]],                  // partner's heartbeat on their last heart
  // orrery + synergies
  align:()=>[[0,0,.4,.6,-1],[.25,0,.4,.6,1],[.5,.4,.35,.3,0]],
  syn:()=>[[0,0,.6,.9,-1],[0,0,.6,.9,1],[.05,.15,.4,.6,0]],
  shock:p=>[[0,0,.35,1,p],[.025,0,.25,1,-p]],
};

/* ================= sound: synthesized from the haptic recipes ================= */
let AC=null,master=null,noiseBuf=null,muted=false;
function audioInit(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.55;
      const comp=AC.createDynamicsCompressor();master.connect(comp).connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){}
}
addEventListener('pointerdown',audioInit);addEventListener('keydown',audioInit);
const VOL={step:.18,mote:.4,thorn:.28,hit:.3,tether:.35,moth:.3,riftHum:.45,charge:.45,select:.5,orbitHit:.35,spit:.45,clink:.45,strain:.5,farHeart:.5,heart:.7,echo:.6,shock:.35,syn:.6,align:.55};
function noise(at,dur,gain,freq,type,out){
  const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  n.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=type==='bandpass'?1.2:.7;
  g.gain.setValueAtTime(gain,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  n.connect(f).connect(g).connect(out);n.start(at,Math.random()*.5,dur+.02);
}
// sharpness -> pitch/brightness, intensity -> loudness; transients are plucks, continuous events are low swells
function sfx(k,ev,pan){
  if(!AC||muted||AC.state!=='running')return;
  const t0=AC.currentTime+.005,v=(VOL[k]??1)*.32,out=AC.createStereoPanner();
  out.pan.value=pan*.7;out.connect(master);
  for(const[t,d,i,s]of ev){
    const at=t0+t,g=AC.createGain(),o=AC.createOscillator();g.connect(out);o.connect(g);
    if(d===0){
      const f=90+s*s*1400,dur=.05+(1-s)*.18;
      o.type='triangle';o.frequency.setValueAtTime(f*1.6,at);o.frequency.exponentialRampToValueAtTime(f,at+.04);
      g.gain.setValueAtTime(i*v,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.start(at);o.stop(at+dur+.02);
      noise(at,dur*.6,i*v*.5,500+s*4000,'bandpass',out);
    }else{
      o.type='sine';o.frequency.setValueAtTime(45+s*320,at);o.frequency.exponentialRampToValueAtTime(30+s*200,at+d);
      g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(i*v*.8,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.start(at);o.stop(at+d+.02);
      if(s<.5)noise(at,d,i*v*.35,160+s*900,'lowpass',out);
    }
  }
}

/* ================= feel = haptics + sound on this machine; emit = to a player (local or over the network) ================= */
const THROTTLE={hit:45,mote:35,orbitHit:60,moth:50,kill:30,killBig:60,spit:80,clink:90,shock:70};
const lastFeel={},RM={l:0,h:0};
const rum=(l,h)=>{RM.l=Math.max(RM.l,l);RM.h=Math.max(RM.h,h)};
function feel(k,pan=0,a){
  if(mode==='dead'&&k!=='death')return;
  const now=performance.now();
  if(THROTTLE[k]&&now-(lastFeel[k]||0)<THROTTLE[k])return;
  lastFeel[k]=now;pan=clamp(pan,-1,1);
  const ev=EV[k](pan,a);
  sfx(k,ev,pan);
  if(native()){NB.ws.send(JSON.stringify({h:ev}));return}
  for(const[t,,i,s]of ev)if(i>=.2)setTimeout(()=>rum(i*(1-s*.5),i*(.3+s*.7)),t*1000); // coarse rumble fallback
}
function emit(p,k,pan=0,a){if(!p||p.gone)return;if(p.local)feel(k,pan,a);else p.out.push([k,+clamp(pan,-1,1).toFixed(2),a])}
function hapW(k,x,a){for(const p of R.players){const dx=x-p.x;if(Math.abs(dx)<W)emit(p,k,dx/(W*.5),a)}} // world event, panned per player
const emitAll=(k,a)=>R.players.forEach(p=>emit(p,k,0,a));

/* ================= input ================= */
const keys={},taps={},mouse={x:0,y:0,l:false,r:false,used:false};
addEventListener('keydown',e=>{keys[e.code]=true;taps[e.code]=true;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.used=true});
addEventListener('mousedown',e=>{if(e.button===0)mouse.l=true;if(e.button===2)mouse.r=true});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false});
addEventListener('contextmenu',e=>e.preventDefault());
const dz=v=>Math.abs(v)<.15?0:v;
let pad=null,prevB=[],prevSY=0,prevSX=0;
function readInput(){
  pad=[...(navigator.getGamepads?.()||[])].find(Boolean)||null;
  const B=[];for(let i=0;i<17;i++)B[i]=!!pad?.buttons[i]?.pressed;
  const edge=i=>B[i]&&!prevB[i],tap=(...c)=>c.some(k=>taps[k]);
  if(B.some((b,i)=>b&&!prevB[i]))audioInit(); // may be refused: some browsers don't count gamepad presses as a user gesture
  const I={mx:0,my:0,aim:null,l2:0,r2:0};
  if(pad){
    I.mx=dz(pad.axes[0]);I.my=dz(pad.axes[1]);
    const ax=pad.axes[2]||0,ay=pad.axes[3]||0;
    if(Math.hypot(ax,ay)>.3){I.aim=Math.atan2(ay,ax);mouse.used=false}
    I.l2=pad.buttons[6]?.value||0;I.r2=pad.buttons[7]?.value||0;
  }
  I.mx+=(keys.KeyD?1:0)-(keys.KeyA?1:0);I.my+=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  const m=Math.hypot(I.mx,I.my);if(m>1){I.mx/=m;I.my/=m}
  if(mouse.used&&R?.players&&mode==='run'){const me=R.players[R.me];I.aim=Math.atan2(mouse.y-H/2+R.cam.y-me.y,mouse.x-W/2+R.cam.x-me.x)}
  if(mouse.l)I.r2=1;if(mouse.r)I.l2=1;
  const sy=pad?pad.axes[1]:0,sx=pad?pad.axes[0]:0;
  I.left=edge(14)||(sx<-.6&&prevSX>=-.6)||tap('ArrowLeft','KeyA');
  I.right=edge(15)||(sx>.6&&prevSX<=.6)||tap('ArrowRight','KeyD');
  I.dash=edge(0)||tap('Space','ShiftLeft');
  I.pickL=edge(4)||tap('KeyQ');I.pickR=edge(5)||tap('KeyE');
  I.pause=edge(9)||tap('Escape','KeyP');
  I.back=edge(1)||tap('Escape');
  I.mute=tap('KeyM');I.theme=tap('KeyT');
  I.up=edge(12)||(sy<-.6&&prevSY>=-.6)||tap('ArrowUp','KeyW');
  I.down=edge(13)||(sy>.6&&prevSY<=.6)||tap('ArrowDown','KeyS');
  I.confirm=edge(0)||tap('Enter','Space');
  prevB=B;prevSY=sy;prevSX=sx;for(const k in taps)delete taps[k];
  return I;
}
const IDLE={mx:0,my:0,aim:null,l2:0,r2:0};

/* ================= persistent progression ================= */
const SAVE_KEY='thicket-save-v1'; // old name kept so existing saves carry over
function loadMeta(){
  const d={motes:0,best:0,runs:0,up:{vit:0,reach:0,swift:0},unlocked:['thorn','pulse'],char:'earth'};
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)return{...d,...s,up:{...d.up,...s.up}}}catch(e){}
  return d;
}
let meta=loadMeta();
meta.theme??=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';setTheme(meta.theme);
const awake=()=>Object.keys(CHARS).filter(k=>meta.best>=CHARS[k].need);
if(!awake().includes(meta.char))meta.char='earth';
const saveMeta=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(meta))}catch(e){}};

/* ================= canvas ================= */
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',resize);resize();

/* ================= state ================= */
// P is "the current player": the weapon owner during a weapon tick, otherwise the player on this machine.
let mode='grove',R=null,P=null,sel=0;
const groveCam={x:0,y:0};
const pp=x=>P?clamp((x-P.x)/(W*.5),-1,1):0;
const alive=()=>R.players.filter(p=>!p.down&&!p.gone);
const partner=p=>R.coop?R.players[1-p.id]:null;
const canHurt=(e,p)=>!R.coop||e.tune<0||e.tune===p.id;

/* ================= weapons ================= */
function proj(x,y,a,spd,dmg,r,col,o={}){
  const owner=o.owner??P;if(owner?.inSec)spd*=1.3; // the lit orrery sector speeds shots up
  R.pr.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,r,col,life:o.life??1.2,pierce:o.pierce||0,kind:o.kind,c:o.c,lvl:o.lvl,owner,hit:new Set(),thru:new Set()});
}
function area(x,y,r,d,kb,owner=P){
  let any=false;const src={x,y};
  for(const e of R.en)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r&&damage(e,d,owner,src)){knock(e,x,y,kb);any=true}
  return any;
}
// L2 + R2 held together, both weapons level 3+: a matching pair gains a combined behavior
const SYN={'rift+thorn':'thorns orbit the rift','flare+pulse':'the pulse ignites','orbit+tether':'stones charge the vine'};
function synOf(p,I){
  const[a,b]=p.slots;if(a.lvl<3||b.lvl<3||I.l2<=.2||I.r2<=.2)return null;
  const k=[a.id,b.id].sort().join('+');return SYN[k]?k:null;
}
function bloomBurst(x,y,c,lvl,owner){
  const r=50+60*c;
  area(x,y,r,(4+10*c)*(1+.25*(lvl-1)),220,owner);
  R.rings.push({x,y,max:r,col:WD.bloom.color,t:0,dur:.3});
  if(lvl>=2)for(let i=0,n=2+2*lvl;i<n;i++)proj(x,y,i/n*TAU,380,1.5,4,WD.bloom.color,{life:.45,pierce:1,owner});
  puff(x,y,WD.bloom.color,14,200);
  emit(owner,'burst',clamp((x-owner.x)/(W*.5),-1,1));R.shake=Math.max(R.shake,7);
}
const WD={
  thorn:{color:'#7fa65a',cost:0,desc:'a stream of thorns. pull deeper to fire faster',
    tick(w,s,dt){
      w.cd-=dt;w.meter=1;
      if(s.down&&w.cd<=0){
        const rate=lerp(4,11,s.v)*(1+.12*(w.lvl-1));w.cd=1/rate;w.hz=Math.round(rate);
        const n=w.lvl>=3?2:1;
        for(let k=0;k<n;k++)proj(P.x,P.y,P.aim+(n>1?(k-.5)*.18:0)+rnd(-.05,.05),640,1+.35*(w.lvl-1),4,this.color,{pierce:w.lvl>=5?1:0,kind:'thorn'});
        emit(P,'thorn',s.pan);
      }
    },
    trig:(w,s)=>s.down?['vb',1,Math.round(3+s.v*5),w.hz]:['wp',1,2,5]}, // crisp click at rest, rattle while firing
  pulse:{color:'#6f93c4',cost:0,desc:'a ring that shoves everything near you away',
    tick(w,s,dt){
      w.cd-=dt;w.meter=1-Math.max(0,w.cd)/w.cdMax;
      if(s.down&&w.cd<=0){
        w.cd=w.cdMax=1.3/(1+.15*(w.lvl-1));
        const r=95+18*w.lvl,ign=P.syn==='flare+pulse';
        if(area(P.x,P.y,r,2+w.lvl,320))emit(P,'hit',0);
        if(ign)for(const e of R.en)if(!e.dead&&!e.dormant&&canHurt(e,P)&&Math.hypot(e.x-P.x,e.y-P.y)<r+e.r&&!shieldBlocks(e,P.x,P.y)){e.burn=2.5;e.burnD=2+1.2*w.lvl;e.burnBy=P}
        R.rings.push({x:P.x,y:P.y,max:r,col:ign?WD.flare.color:this.color,t:0,dur:ign?.36:.28,sq:1,ang:Math.atan2(P.vy,P.vx),st:clamp(Math.hypot(P.vx,P.vy)/1200,0,.25)});
        emit(P,ign?'burst':'pulse',s.pan);
      }
    },
    trig:w=>w.cd>0?['fb',0,7]:['wp',2,5,6]},
  tether:{color:'#d39aa6',cost:40,desc:'a living vine that drains whatever you point at',
    tick(w,s,dt){
      w.links=[];w.meter=1;
      if(!s.down){w.tg=null;return}
      if(!w.tg||w.tg.dead||w.tg.dormant||dist(w.tg,P)>330){
        w.tg=null;let best=1e9;
        for(const e of R.en){const d=dist(e,P);if(!e.dead&&!e.dormant&&canHurt(e,P)&&d<290&&d<best&&Math.abs(angDiff(Math.atan2(e.y-P.y,e.x-P.x),P.aim))<.75){best=d;w.tg=e}}
      }
      if(!w.tg)return;

const SPAWNABLE=Object.entries(ET).filter(([,t])=>t.from);
// every fifth stage is a boss, in rotation: brood (5), eclipse (10), comet (15), then again
const BOSS={
  brood:{hp:1,r:54,name:'the brood',twin:'the twin brood',sub:''},

const bossKind=n=>['comet','brood','eclipse'][(n/5)%3];
console.assert(bossKind(5)==='brood'&&bossKind(10)==='eclipse'&&bossKind(15)==='comet'&&bossKind(20)==='brood','bossKind');
function spawnBoss(kind,x,y){
  const e=spawnEnemy('boss',x,y),B=BOSS[kind];
  e.kind=kind;e.r=B.r;e.hp=e.max=e.max*B.hp;e.sa=0;e.shield=kind==='eclipse';return e;
}
// eclipse shield: SEG arcs around the core, each solid for SOLID of its span, the rest a gap
const SEG=6,SOLID=.7,shieldR=e=>e.r+26;
const shieldSolid=(e,a)=>((((a-e.sa)/(TAU/SEG))%1)+1)%1<SOLID;
const shieldBlocks=(e,x,y)=>!!e.shield&&(x-e.x)**2+(y-e.y)**2>shieldR(e)**2&&shieldSolid(e,Math.atan2(y-e.y,x-e.x));
console.assert(shieldSolid({sa:0},.1)&&!shieldSolid({sa:0},TAU/SEG*.85)&&shieldSolid({sa:0},-TAU+.1),'shieldSolid');
function spawnRing(){
  const al=alive(),p=al[Math.floor(Math.random()*al.length)]||R.players[0];
  const a=rnd(0,TAU),d=Math.hypot(W,H)/2+60;return[p.x+Math.cos(a)*d,p.y+Math.sin(a)*d];
}
function spawnEnemy(type,x,y,elite=false){
  if(x==null)[x,y]=spawnRing();
  const T=ET[type],sc=(1+(R.stage-1)*.3)*(R.coop?1.5:1);
  // co-op: some enemies carry a player's colour; only that player can hurt them, and they hunt the other one
  const tune=R.coop&&R.stage>=2&&type!=='boss'&&Math.random()<.4?(Math.random()<.5?0:1):-1;
  const e={type,x,y,r:T.r*(elite?1.35:1),hp:T.hp*sc*(elite?3:1),spd:T.spd*(1+R.stage*.015)*(elite?.9:1),elite,tune,
    st:'go',t:0,t0:1,cd:rnd(.5,2),kx:0,ky:0,flash:0,face:0,orbT:0,dead:false,dormant:false,pat:0,dx:0,dy:0,vol:0,volT:0};
  e.max=e.hp;e.id=++R.eid;R.en.push(e);return e;
}
function pickType(){
  const pool=SPAWNABLE.filter(([,t])=>R.stage>=t.from);
  let r=Math.random()*pool.reduce((s,[,t])=>s+t.w,0);

function target(e){
  const al=alive();if(!al.length)return R.players[0];
  if(e.tune>=0){const o=al.find(p=>p.id!==e.tune);if(o)return o}
  let b=al[0],bd=1e9;for(const p of al){const d=dist(p,e);if(d<bd){bd=d;b=p}}return b;
}
function knock(e,x,y,f){const d=Math.hypot(e.x-x,e.y-y)||1,k=e.type==='boss'?.15:1;e.kx+=(e.x-x)/d*f*k;e.ky+=(e.y-y)/d*f*k}

function damage(e,d,owner=P,src=owner){
  if(e.dead||e.dormant)return false;
  if(owner&&!canHurt(e,owner)){emit(owner,'clink',clamp((e.x-owner.x)/(W*.5),-1,1));return false}
  if(src&&shieldBlocks(e,src.x,src.y)){if(owner)emit(owner,'clink',clamp((e.x-owner.x)/(W*.5),-1,1));return false}
  if(owner&&R.coop&&R.bond.st==='buff')d*=1.2;

function puff(x,y,col,n,sp){

  if(R.coop&&!R.guest)R.puffOut.push([Math.round(x),Math.round(y),col,n,sp]);

// a dead enemy breaks into 3-4 flat wedges that slide out with friction and fade
function shatter(x,y,r,col,n=3+(Math.random()<.5)){
  const a0=rnd(0,TAU),sp=r>30?1.6:1;
  for(let k=0;k<n;k++){
    const a=a0+k/n*TAU,b=a0+(k+1)/n*TAU,m=(a+b)/2;
    const pts=[[0,0],[Math.cos(a)*r,Math.sin(a)*r],[Math.cos(m)*r,Math.sin(m)*r],[Math.cos(b)*r,Math.sin(b)*r]];
    const cx=pts.reduce((s,p)=>s+p[0],0)/4,cy=pts.reduce((s,p)=>s+p[1],0)/4,v=rnd(70,150)*sp;
    R.sh.push({x:x+cx,y:y+cy,vx:Math.cos(m)*v,vy:Math.sin(m)*v,rot:0,vr:rnd(-6,6),life:1,col,pts:pts.map(([px,py])=>[px-cx,py-cy])});
  }
  if(R.coop&&!R.guest)R.shOut.push([Math.round(x),Math.round(y),Math.round(r),col,n]);
}
function fxStep(dt){
  for(const q of R.pa){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt*q.decay}
  R.pa=R.pa.filter(q=>q.life>0);
  const fr=Math.pow(.03,dt);
  for(const s of R.sh){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=fr;s.vy*=fr;s.vr*=fr;s.rot+=s.vr*dt;s.life-=dt*1.4}

}
// stage-clear choice: one option grows a weapon you hold, the other is a new one from your pool
function relicOptions(p){

function killEnemy(e,count=true){
  if(e.dead)return;
  // twin brood: a fallen twin lies dormant for 6s and rises again unless the other falls too
  if(e.type==='boss'&&e.twin&&R.breather<=0){
    const tw=e.twin;
    if(!tw.dead&&!tw.dormant){
      e.dormant=true;e.t=6;e.hp=0;e.st='go';e.vol=0;
      R.banner={text:'one has fallen',sub:'bring down the other within six seconds',t:3};
      hapW('killBig',e.x);puff(e.x,e.y,PAL.red,30,260);R.hs=Math.max(R.hs,.035);return;
    }

  }

  if(e.elite||e.type==='boss')R.hs=Math.max(R.hs,e.type==='boss'?.035:.025); // hitstop
  for(let i=0,n=T.motes*(e.elite?3:1);i<n;i++){const a=rnd(0,TAU),s=rnd(40,160);R.motes.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s})}
  if(Math.random()<.035)R.motes.push({x:e.x,y:e.y,vx:0,vy:0,heal:true});
  hapW(big?'killBig':'kill',e.x);R.shake=Math.max(R.shake,big?8:2);
  if(e.type==='splitter'&&R.breather<=0)for(let i=0;i<2;i++){const m=spawnEnemy('mite',e.x+rnd(-10,10),e.y+rnd(-10,10));m.tune=e.tune}
  if(e.elite&&Math.random()<.5)dropRelic(e.x,e.y);
  if(count&&e.type!=='mite'){R.kills++;R.total++}
  if(e.type==='boss')stageClear();
}
const bossRR=e=>e.kind==='eclipse'?200:230;
function stomp(e,rr,cd){

function stageSetup(n){

function director(dt){

// co-op bond: a sweet spot gives +20% damage; stretched too far it strains and finally snaps, hurting both
function bondUpdate(dt){

  const[a,b]=R.players;R.bond.flash=Math.max(0,R.bond.flash-dt);
  if(a.gone||b.gone||a.down||b.down){R.bond.st='off';R.bond.strain=0;return}
  const d=dist(a,b);R.bond.d=d;

/* ================= the orrery: slow rings behind the field; every 45s two nodes align and light a sector ================= */
// The rings centre on a point that drifts after the players, so the lit sector is always within reach.
const ORB=[{r:200,w:.05},{r:380,w:-.035},{r:580,w:.024},{r:800,w:-.017},{r:1050,w:.012}];

  const ang=ORB.map((o,n)=>o.w*t+n*1.7);

  const dx=p.x-R.orr.x,dy=p.y-R.orr.y,d=Math.hypot(dx,dy);

function loadPeer(){

    const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('could not load PeerJS (offline?)'));document.head.appendChild(s);

  NET.code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');

async function netJoin(code){

      const cap=id=>clamp(m.up?.[id]|0,0,GROVE.find(x=>x.id===id).max);
      const up={vit:cap('vit'),reach:cap('reach'),swift:cap('swift')};
      const unlocked=Array.isArray(m.unlocked)?m.unlocked.filter(w=>w in WD):[];
      newRun({up,unlocked});mode='run';NET.conn.send({t:'start'});

      const p=R.players[1],prev=p.in||{};

function drawWeaponGlyph(id,x,y,s){
  const c=WD[id].color;
  if(id==='thorn')ngon(x,y,s,3,-Math.PI/2,c);
  else if(id==='pulse')ring(x,y,s*.75,c,s*.35);
  else if(id==='tether'){g.strokeStyle=c;g.lineWidth=s*.3;g.beginPath();g.moveTo(x-s,y);g.bezierCurveTo(x-s*.3,y-s,x+s*.3,y+s,x+s,y);g.stroke()}
  else if(id==='orbit'){for(let i=0;i<3;i++)circle(x+Math.cos(i*TAU/3)*s*.6,y+Math.sin(i*TAU/3)*s*.6,s*.32,c)}
  else if(id==='bloom'){for(let i=0;i<5;i++)circle(x+Math.cos(i*TAU/5)*s*.5,y+Math.sin(i*TAU/5)*s*.5,s*.35,c);circle(x,y,s*.3,PAL.paper)}
  else if(id==='swarm'){for(let i=0;i<3;i++)ngon(x+(i-1)*s*.6,y+(i%2?-1:1)*s*.25,s*.35,4,0,c)}
  else if(id==='rift'){circle(x,y,s*.85,c);circle(x,y,s*.4,PAL.paper)}
  else if(id==='flare'){circle(x,y,s*.45,c);for(let i=0;i<6;i++)circle(x+Math.cos(i*TAU/6)*s*.85,y+Math.sin(i*TAU/6)*s*.85,s*.17,c)}
  else if(id==='crescent')ring(x,y,s*.6,c,s*.35,Math.PI*.55,Math.PI*1.95);
}
// a body: earth has a land mass, moon a crater, sun a turning ring of rays
function drawBody(ch,x,y,r,col,t){
  circle(x,y,r,col);
  if(ch==='earth'){g.beginPath();g.ellipse(x-r*.2,y-r*.15,r*.5,r*.32,.6,0,TAU);g.fillStyle=PAL.sage;g.fill()}
  else if(ch==='moon')circle(x+r*.35,y-r*.3,r*.28,'rgba(0,0,0,.2)');
  else if(ch==='sun')for(let i=0;i<8;i++){const a=t*.8+i*TAU/8;circle(x+Math.cos(a)*(r+4),y+Math.sin(a)*(r+4),1.6,col)}
}
function drawOrrery(){
  const s=orrState(R.t),o=R.orr;
  circle(o.x,o.y,3,PAL.faint2);
  if(s.on){ // the lit sector between the two aligned rings
    const r0=ORB[s.i].r-40,r1=ORB[s.j].r+40;
    g.beginPath();g.arc(o.x,o.y,r1,s.a-SEC_W,s.a+SEC_W);g.arc(o.x,o.y,r0,s.a+SEC_W,s.a-SEC_W,true);g.closePath();
    g.fillStyle='rgba(220,174,79,.06)';g.fill();g.globalAlpha=.4;g.strokeStyle=PAL.mustard;g.lineWidth=1;g.stroke();g.globalAlpha=1;
    ring(o.x,o.y,r1+6,PAL.mustard,2,s.a-SEC_W,s.a-SEC_W+2*SEC_W*clamp(s.left/ALIGN_FOR,0,1)); // time left
  }
  ORB.forEach((b,n)=>{
    ring(o.x,o.y,b.r,PAL.faint2,1);
    const hot=s.k>0&&(n===s.i||n===s.j);
    circle(o.x+Math.cos(s.ang[n])*b.r,o.y+Math.sin(s.ang[n])*b.r,hot?5:3.5,hot?PAL.mustard:PAL.faint2);
  });
}
function zig(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1;g.beginPath();g.moveTo(x1,y1);
  for(let i=1;i<5;i++){const o=rnd(-6,6);g.lineTo(x1+dx*i/5-dy/l*o,y1+dy*i/5+dx/l*o)}
  g.lineTo(x2,y2);g.stroke();
}
function pips(lvl,x,y,col){for(let k=0;k<5;k++){const px=x+k*9;if(k<lvl)circle(px,y,2.6,col);else ring(px,y,2.3,PAL.muted,1.2)}}
function drawRun(){
  g.setTransform(dpr,0,0,dpr,0,0);
  const sx=rnd(-R.shake,R.shake),sy=rnd(-R.shake,R.shake);
  g.translate(W/2-R.cam.x+sx,H/2-R.cam.y+sy);
  drawGround(R.cam);
  drawOrrery();
  if(R.haz.length){ // the comet's wake, as one flat shape
    g.beginPath();for(const h of R.haz){const r=h.r*Math.min(1,h.life*1.5);g.moveTo(h.x+r,h.y);g.arc(h.x,h.y,r,0,TAU)}
    g.globalAlpha=.28;g.fillStyle=PAL.mustard;g.fill();g.globalAlpha=1;
  }
  for(const w of R.wells){g.globalAlpha=Math.min(1,w.life)*.18;circle(w.x,w.y,w.r,WD.rift.color);g.globalAlpha=1;circle(w.x,w.y,10+Math.sin(R.t*8)*2,WD.rift.color);
    ring(w.x,w.y,w.r*(1-(R.t*.8%1)),WD.rift.color,1.5)}
  for(const m of R.motes)m.heal?(circle(m.x,m.y,6,PAL.red),circle(m.x,m.y,2.5,PAL.paper)):ngon(m.x,m.y,4,4,0,PAL.mote);
  for(const r of R.relics){
    const y=r.y+Math.sin(r.t*2)*3;
    g.globalAlpha=.25;g.beginPath();g.ellipse(r.x,r.y+16,12,4,0,0,TAU);g.fillStyle='#000';g.fill();g.globalAlpha=1;
    drawWeaponGlyph(r.id,r.x,y,11);
    text(`${r.id} ${ROMAN[r.lvl]}`,r.x,r.y+34,12,PAL.muted,'center');
  }
  for(const c of R.choices){ // two pedestals: left takes L1 / Q, right takes R1 / E
    const o=R.players[c.owner];
    if(R.coop)circle(c.x,c.y+17,3,PCOL[c.owner]);
    c.opts.forEach((op,k)=>{
      const x=c.x+(k?56:-56),y=c.y+Math.sin(R.t*2+k)*3,grow=o?.slots.some(w=>w.id===op.id);
      g.fillStyle=PAL.faint2;g.beginPath();g.roundRect(x-18,c.y+14,36,6,3);g.fill();
      drawWeaponGlyph(op.id,x,y-4,11);
      text(grow?`${op.id} +${op.lvl}`:`${op.id} ${ROMAN[op.lvl]}`,x,c.y+38,12,PAL.ink,'center',600);
      text(`${grow?'grow':'new'} · ${k?(pad?'R1':'E'):(pad?'L1':'Q')}`,x,c.y+53,11,PAL.muted,'center');
    });
  }
  for(const b of R.eb){circle(b.x,b.y,5,PAL.ink);circle(b.x,b.y,2,PAL.paper)}
  for(const b of R.pr){
    if(b.kind==='seed')circle(b.x,b.y,b.r,b.col);
    else if(b.kind==='boom'){const a=R.t*14;ring(b.x,b.y,b.r,b.col,3.5,a,a+Math.PI*1.2)}
    else{g.strokeStyle=b.col;g.lineWidth=b.r>5?b.r:3;g.lineCap='round';g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.018,b.y-b.vy*.018);g.stroke()}
  }
  for(const m of R.moths){const a=Math.atan2(m.vy,m.vx),f=Math.abs(Math.sin(R.t*30+m.ph));ngon(m.x,m.y,5,4,a,m.col);circle(m.x+Math.cos(a+1.6)*4*f,m.y+Math.sin(a+1.6)*4*f,2.5,m.col);circle(m.x+Math.cos(a-1.6)*4*f,m.y+Math.sin(a-1.6)*4*f,2.5,m.col)}
  for(const e of R.en)drawEnemy(e);
  for(const s of R.sh){
    g.save();g.translate(s.x,s.y);g.rotate(s.rot);g.globalAlpha=Math.max(0,s.life);g.beginPath();
    for(const[x,y]of s.pts)g.lineTo(x,y);g.closePath();g.fillStyle=s.col;g.fill();g.restore();
  }
  g.globalAlpha=1;
  // the bond: slack under 120, dashed in the 120-380 sweet spot, taut past 380, red with a shrinking triangle while it strains
  if(R.coop&&R.bond.st!=='off'){
    const[a,b]=R.players,s=R.bond.st,d=R.bond.d,line=()=>{g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()};
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(s==='strain'){
      g.strokeStyle=PAL.red;g.lineWidth=2.5;line();
      ngon(mx,my,6+12*(1-clamp(R.bond.strain/3,0,1)),3,-Math.PI/2,PAL.red);
    }else if(s==='buff'){g.strokeStyle='#e8d9a8';g.globalAlpha=.6;g.lineWidth=2;g.setLineDash([10,8]);line();g.setLineDash([])}
    else if(d>=380){g.strokeStyle=PAL.ink;g.globalAlpha=.55;g.lineWidth=1.5;line()}
    else{g.strokeStyle=PAL.ink;g.globalAlpha=.15;g.lineWidth=1.5;g.beginPath();g.moveTo(a.x,a.y);g.quadraticCurveTo(mx,my+14,b.x,b.y);g.stroke()}
    if(R.bond.flash>0){g.globalAlpha=R.bond.flash/.4;g.strokeStyle=PAL.white;g.lineWidth=8;line()}
    g.globalAlpha=1;
  }
  // orbit + tether: arcs from each stone to the vine
  for(const p of R.players){
    if(p.syn!=='orbit+tether')continue;
    const L=p.slots.find(w=>w.id==='tether')?.links[0],ow=p.slots.find(w=>w.id==='orbit');if(!L||!ow)continue;
    const[a,b]=L,abx=b.x-a.x,aby=b.y-a.y;g.strokeStyle=WD.tether.color;g.lineWidth=1.5;
    for(const[sx,sy]of ow.stones){const t=clamp(((sx-a.x)*abx+(sy-a.y)*aby)/(abx*abx+aby*aby||1),0,1);zig(sx,sy,a.x+abx*t,a.y+aby*t)}
  }
  for(const p of R.players)for(const w of p.slots)for(const[a,b]of w.links){
    g.strokeStyle=WD.tether.color;g.lineWidth=3;g.beginPath();g.moveTo(a.x,a.y);
    const mx=(a.x+b.x)/2+Math.sin(R.t*20)*8,my=(a.y+b.y)/2+Math.cos(R.t*17)*8;g.quadraticCurveTo(mx,my,b.x,b.y);g.stroke();
  }
  for(const p of R.players){
    if(p.gone)continue;
    const col=pcol(p);
    if(p.down){
      ring(p.x,p.y,p.r,col,2);circle(p.x,p.y,4,col);
      if(p.revive>0)ring(p.x,p.y,p.r+8,col,4,-Math.PI/2,-Math.PI/2+TAU*p.revive/2.5);
      g.globalAlpha=.3;g.setLineDash([3,6]);ring(p.x,p.y,60,col,1.5);g.setLineDash([]);g.globalAlpha=1;
      continue;
    }
    if(mode!=='run'||!(p.inv<=0||Math.floor(p.inv*14)%2))continue;
    const sq=1+clamp(Math.hypot(p.vx,p.vy)/900,0,.35)*(p.dashT>0?1:.25); // stretch along velocity, mostly on dashes
    if(p.inSec)ring(p.x,p.y,p.r+5,PAL.mustard,1);
    g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(p.vy,p.vx));g.scale(sq,1/sq);drawBody(p.ch,0,0,p.r,col,R.t);g.restore();
    circle(p.x+Math.cos(p.aim)*6,p.y+Math.sin(p.aim)*6,3,PAL.paper);
    g.globalAlpha=.25;circle(p.x+Math.cos(p.aim)*26,p.y+Math.sin(p.aim)*26,2,col);g.globalAlpha=1;
    if(R.coop&&p!==P)text(PNAME[p.id],p.x,p.y-18,11,col,'center',600);
  }
  for(const p of R.players)for(const w of p.slots)for(const[x,y]of w.stones){circle(x,y,7,WD.orbit.color);if(p.syn==='orbit+tether')ring(x,y,9,WD.tether.color,1.5)}
  for(const r of R.rings){
    const k=r.t/r.dur;g.globalAlpha=1-k;
    if(r.sq){ // pulse: overshoots, thick to thin, stretched along the way you were moving
      const st=(r.st||0)*(1-k);g.save();g.translate(r.x,r.y);g.rotate(r.ang||0);g.scale(1+st,1-st);
      ring(0,0,r.max*(1-(1-k)**3)*(1+.1*Math.sin(k*Math.PI)),r.col,7*(1-k)**2+1);g.restore();
    }else ring(r.x,r.y,r.max*Math.sqrt(k),r.col,4*(1-k)+1);
  }
  g.globalAlpha=1;
  for(const q of R.pa){g.globalAlpha=Math.max(0,q.life);g.fillStyle=q.col;g.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}
  g.globalAlpha=1;
  const ch=R.choices.find(c=>c.owner===P.id&&dist(c,P)<120);
  if(ch&&mode==='run')text(`${pad?'L1':'Q'} ◂  choose one  ▸ ${pad?'R1':'E'}`,ch.x,ch.y-34,12,PAL.ink,'center',600);
  else if(P.near&&mode==='run'){
    const r=P.near,same=P.slots.map(w=>w.id===r.id);
    text(`${pad?'L1':'Q'} ◂  ${same[0]?'grow':'swap'}  ·  ${same[1]?'grow':'swap'}  ▸ ${pad?'R1':'E'}`,r.x,r.y-24,12,PAL.ink,'center',600);
  }
  drawHud();
}
function bossProg(){const bs=R.en.filter(e=>e.type==='boss');return bs.length?1-bs.reduce((s,e)=>s+(e.dormant?0:Math.max(0,e.hp)/e.max),0)/bs.length:1}
function hearts(p,x,y,size,col){

}
function drawHud(){

  hearts(P,24,24,6,pcol(P));
  const o=R.coop?R.players[1-P.id]:null;
  if(o&&!o.gone){
    hearts(o,24,44,4,PCOL[o.id]);
    const sx=o.x-R.cam.x+W/2,sy=o.y-R.cam.y+H/2;
    if(sx<16||sx>W-16||sy<16||sy>H-16){ // partner off screen: point at them
      const ax=clamp(sx,22,W-22),ay=clamp(sy,60,H-80),a=Math.atan2(sy-H/2,sx-W/2);

  text(`stage ${R.stage}`,W/2,26,14,PAL.ink,'center',600);

  g.fillStyle=PAL.faint2;g.fillRect(W/2-80,34,160,3);g.fillStyle=R.stage%5===0?PAL.red:PAL.ink;g.fillRect(W/2-80,34,160*clamp(prog,0,1),3);
  ngon(W-70,21,5,4,0,PAL.mote);text(`${P.runMotes}`,W-58,26,14,PAL.ink,'left',600);
  if(R.coop)text(`you are ${PNAME[P.id]}`,W-16,46,11,PCOL[P.id],'right',600);
  // trigger loadout: L2 bottom-left, R2 bottom-right. arc = cooldown / charge, pips = level
  P.slots.forEach((w,i)=>{
    const cx=i?W-44:44,cy=H-44,c=WD[w.id].color,tx=i?cx-38:cx+38,al=i?'right':'left';
    circle(cx,cy,28,PAL.card);ring(cx,cy,22,PAL.faint2,3);
    ring(cx,cy,22,c,3,-Math.PI/2,-Math.PI/2+TAU*clamp(w.meter,0,1));
    drawWeaponGlyph(w.id,cx,cy,9);
    text(i?'R2':'L2',tx,cy-12,11,PAL.muted,al,600);
    text(w.id,tx,cy+4,13,PAL.ink,al,600);
    pips(w.lvl,i?tx-36:tx+2,cy+15,c);
  });
  if(P.syn)text(`${P.syn.replace('+',' + ')} · ${SYN[P.syn]}`,W/2,H-24,12,PAL.ink,'center',600);
  if(P.down)text('you are down · your partner can bring you back',W/2,H-80,13,PCOL[P.id],'center',600);
  if(R.banner){
    g.globalAlpha=Math.min(1,R.banner.t);
    text(R.banner.text,W/2,H*.28,26,PAL.ink,'center',650);
    if(R.banner.sub)text(R.banner.sub,W/2,H*.28+26,14,PAL.muted,'center');
    g.globalAlpha=1;
  }
}

const steep=(n,k)=>n>=3?k*(n-2)**2:0;
console.assert(steep(2,40)===0&&steep(3,40)===40&&steep(4,40)===160,'steep');
const GROVE=[
  {id:'begin',label:'begin a run',desc:null},
  {id:'char',label:'',desc:null},
  {id:'host',label:'co-op · host',desc:'start a duo run · the invite link is copied for you'},
  {id:'join',label:'co-op · join',desc:"enter your partner's code"},
  // past level 3 each step climbs quadratically, so deep runs still have something to save for
  {id:'vit',label:'vitality',desc:'start with one more heart',max:5,cost:n=>30+25*n+steep(n,40)},
  {id:'reach',label:'reach',desc:'pull motes from farther away',max:6,cost:n=>20+15*n+steep(n,30)},
  {id:'swift',label:'swift',desc:'dash recovers faster',max:5,cost:n=>25+20*n+steep(n,35)},
  ...Object.entries(WD).filter(([,d])=>d.cost).map(([w,d])=>({id:'w',w,label:w,desc:d.desc,cost:()=>d.cost})),
];
function groveBuy(it){
  if(it.w){
    if(meta.unlocked.includes(it.w)||meta.motes<it.cost())return feel('deny');
    meta.motes-=it.cost();meta.unlocked.push(it.w);
  }else{
    const n=meta.up[it.id];
    if(n>=it.max||meta.motes<it.cost(n))return feel('deny');
    meta.motes-=it.cost(n);meta.up[it.id]++;
  }
  saveMeta();feel('upgrade');
}
function soundHint(){return!AC||AC.state!=='running'?'click or press a key to turn on sound':muted?'sound off · M':'sound on · M'}
function backdrop(dt){
  groveCam.x+=dt*14;groveCam.y+=dt*5;
  g.setTransform(dpr,0,0,dpr,0,0);g.translate(W/2-groveCam.x,H/2-groveCam.y);drawGround(groveCam);
  veil(.55);
}
function grove(dt,I){
  if(I.up){sel=(sel+GROVE.length-1)%GROVE.length;feel('select')}
  if(I.down){sel=(sel+1)%GROVE.length;feel('select')}
  if(GROVE[sel].id==='char'&&(I.left||I.right)){
    const a=awake();if(a.length<2)feel('deny');
    else{meta.char=a[(a.indexOf(meta.char)+(I.right?1:a.length-1))%a.length];saveMeta();feel('select')}
  }
  if(I.confirm){
    const it=GROVE[sel];
    if(it.id==='begin'){newRun();mode='run';feel('pickup');return}
    if(it.id==='host'){netHost();return}
    if(it.id==='join'){netJoin();return}
    if(it.id==='char'){
      const a=awake();if(a.length<2)return feel('deny');
      meta.char=a[(a.indexOf(meta.char)+1)%a.length];saveMeta();feel('select');return;
    }
    groveBuy(it);
  }
  backdrop(dt);
  const SUB=18,rowH=clamp((H-330-SUB)/GROVE.length,24,38),cx=W/2,top=Math.max(16,H/2-130-(GROVE.length*rowH+SUB)/2);
  text('orrery',cx,top+40,46,PAL.ink,'center',700);
  text('small worlds against the dark. what you gather stays with you.',cx,top+68,14,PAL.muted,'center');
  const lw=Math.min(460,W-32),lx=cx-lw/2;
  GROVE.forEach((it,i)=>{
    const y=top+100+i*rowH+(i>1?SUB:0),my=y+rowH/2-3;
    if(i===sel){g.fillStyle=PAL.card;g.beginPath();g.roundRect(lx,y,lw,rowH-6,6);g.fill()}
    if(it.w)drawWeaponGlyph(it.w,lx+18,my,8);
    if(it.id==='host'||it.id==='join'){circle(lx+14,my,4,PCOL[0]);circle(lx+24,my,4,PCOL[1])}
    if(it.id==='char')drawBody(meta.char,lx+19,my,7,CHARS[meta.char].col,groveCam.x/14);
    const icon=it.w||it.id==='host'||it.id==='join'||it.id==='char';
    text(it.id==='char'?(awake().length>1?`‹ play as ${meta.char} ›`:`play as ${meta.char}`):it.label,lx+(icon?34:14),my+5,14,PAL.ink,'left',i===sel?650:500);
    if(it.id==='char'){const C=CHARS[meta.char];text(`${C.trait} · L2 ${C.slots[0]} · R2 ${C.slots[1]}`,lx+34,y+rowH+8,11,PAL.muted)}
    let right='';
    if(it.id==='char'){const next=Object.keys(CHARS).find(k=>!awake().includes(k));right=next?`${next}: clear stage ${CHARS[next].need-1}`:'all awake'}
    if(it.w)right=meta.unlocked.includes(it.w)?'grows in the wild':`${it.cost()} ◆`;
    else if(it.max){const n=meta.up[it.id];right=(n>=it.max?'full':`${it.cost(n)} ◆`);
      for(let k=0;k<it.max;k++){const px=lx+lw-150+k*12;if(k<n)circle(px,my,4,PAL.ink);else ring(px,my,3.5,PAL.muted,1.2)}}
    if(right)text(right,lx+lw-12,my+5,13,PAL.muted,'right');
  });
  const it=GROVE[sel],fy=top+110+GROVE.length*rowH+SUB;
  text(it.id==='char'?CHARS[meta.char].desc:it.desc||(meta.runs?`run ${meta.runs+1} as ${meta.char}`:`your first run, as ${meta.char}`),cx,fy,13,PAL.ink,'center');
  ngon(cx-70,fy+27,5,4,0,PAL.mote);
  text(`${meta.motes} banked  ·  best stage ${meta.best}`,cx-58,fy+32,13,PAL.ink,'left',600);
  text('move L-stick · aim R-stick · weapons L2 / R2 · dash ✕ · take relic L1 / R1 · pause options',cx,fy+64,12,PAL.muted,'center');
  text('keyboard: WASD · mouse aim · left/right click · shift dash · Q / E take · esc pause',cx,fy+82,12,PAL.muted,'center');
  const hs=native()?'dualsense · native haptics on':NB.ws?'haptics bridge up · no controller':pad?(BRIDGE?'gamepad · basic rumble (run bridge.swift for native haptics)':'gamepad connected'):'no controller · press a button on it to connect';
  text(`${hs}  ·  ${soundHint()}  ·  ${meta.theme} · T`,cx,H-18,11,PAL.muted,'center');
}
function lobby(I,status){
  if(I.back){toGrove();return}
  backdrop(1/60);
  const cx=W/2,cy=H/2;
  circle(cx-10,cy-110,7,PCOL[0]);circle(cx+10,cy-110,7,PCOL[1]);
  text('co-op',cx,cy-74,30,PAL.ink,'center',700);
  if(NET.role==='host'&&NET.code){
    text('your code',cx,cy-30,13,PAL.muted,'center');
    text(NET.code,cx,cy+22,56,PCOL[0],'center',700);
    text('you are sun · your partner joins as moon',cx,cy+56,13,PAL.muted,'center');
  }else if(NET.role==='guest')text('you are moon · your partner hosts as sun',cx,cy+10,13,PAL.muted,'center');
  const st=status||(NET.status==='waiting'?(NET.copied?'link copied · waiting for moon…':'waiting for moon · share the link or code'):NET.status);
  text(st,cx,cy+90,14,PAL.ink,'center',600);
  if(NET.link)text(NET.link,cx,cy+148,11,PAL.muted,'center');
  text(`${pad?'○':'esc'} to cancel`,cx,cy+120,12,PAL.muted,'center');
  text('both of you open this page · the code goes through the PeerJS server',cx,H-18,11,PAL.muted,'center');
}

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const I=readInput();
  if(I.mute)muted=!muted;
  if(I.theme){meta.theme=meta.theme==='light'?'dark':'light';setTheme(meta.theme);saveMeta()}
  if(mode==='grove')grove(dt,I);
  else if(mode==='lobby')lobby(I);
  else if(NET.role==='guest'){
    if(mode==='run')guestFrame(dt,I);
    else if(!R)toGrove();
    else{R.deadT-=dt;drawRun();drawDead();if(I.confirm&&R.deadT<=0)toGrove()}
  }else if(mode==='run'){
    if(I.pause&&!R.coop)R.paused=!R.paused;
    if(!R.paused){if(R.hs>0)R.hs-=dt;else update(dt,I);netSend()} // R.hs: hitstop freeze
    drawRun();if(R.paused)drawPause();
  }else{
    update(dt*.25,IDLE);netSend();R.deadT-=dt;drawRun();drawDead();
    if(I.confirm&&R.deadT<=0)toGrove();
  }
  controllerOut(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
{const j=new URLSearchParams(location.search).get('join');if(j)netJoin(j)} // opened from an invite link
</script>
